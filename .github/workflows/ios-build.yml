name: iOS Build

on:
  workflow_dispatch:

jobs:
  build-ios:
    name: iOS Build
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          architecture: x64

      - name: Flutter doctor
        run: flutter doctor -v

      - name: Create clean iOS project
        run: |
          rm -rf ios
          flutter create --platforms=ios --org com.beta --project-name beta_messenger .
          ls -la ios/Runner.xcodeproj/

      - name: Apply custom iOS config
        run: |
          cp ios_custom/Info.plist ios/Runner/Info.plist
          cp ios_custom/AppDelegate.swift ios/Runner/AppDelegate.swift
          cp ios_custom/Runner-Bridging-Header.h ios/Runner/Runner-Bridging-Header.h
          cp ios_custom/DebugProfile.entitlements ios/Runner/DebugProfile.entitlements
          cp ios_custom/Release.entitlements ios/Runner/Release.entitlements
          cp ios_custom/Podfile ios/Podfile
          mkdir -p ios/Runner.xcodeproj/xcshareddata/xcschemes
          cp ios_custom/Runner.xcscheme ios/Runner.xcodeproj/xcshareddata/xcschemes/Runner.xcscheme
          echo "=== Done ==="
          ls -la ios/Runner.xcodeproj/xcshareddata/xcschemes/

      - name: Install dependencies
        run: flutter pub get

      - name: Install pods
        working-directory: ios
        run: |
          pod repo update
          pod install

      - name: Build iOS
        run: flutter build ios --release --no-codesign

      - name: Create IPA
        working-directory: build/ios/iphoneos
        run: |
          mkdir Payload
          mv Runner.app Payload/
          zip -qq -r -9 Beta.ipa Payload

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: Beta-iOS
          path: build/ios/iphoneos/Beta.ipa
          retention-days: 30
