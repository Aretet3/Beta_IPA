name: iOS Build

on:
  workflow_dispatch:

jobs:
  build-ios:
    name: iOS Build
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          architecture: x64

      - name: Flutter doctor
        run: flutter doctor -v

      - name: Generate iOS project
        run: flutter create --platforms=ios --org com.beta --project-name beta_messenger .

      - name: Create shared Xcode scheme with correct UUIDs
        run: |
          PROJ="ios/Runner.xcodeproj/project.pbxproj"
          RUNNER_UUID=$(grep -m1 'isa = PBXNativeTarget' -B5 "$PROJ" | grep -o '[A-F0-9]\{24\}' | head -1)
          TESTS_UUID=$(grep -m1 'isa = PBXNativeTarget' -A5 "$PROJ" | grep -o '[A-F0-9]\{24\}' | tail -1)

          if [ -z "$RUNNER_UUID" ]; then
            RUNNER_UUID="73F3B21E2505FCAE00AE9609"
          fi
          if [ -z "$TESTS_UUID" ]; then
            TESTS_UUID="73F3B21F2505FCAE00AE9609"
          fi

          echo "Runner UUID: $RUNNER_UUID"
          echo "Tests UUID: $TESTS_UUID"

          SCHEME_DIR="ios/Runner.xcodeproj/xcshareddata/xcschemes"
          mkdir -p "$SCHEME_DIR"

          cat > "$SCHEME_DIR/Runner.xcscheme" << XCSHEME_EOF
          <?xml version="1.0" encoding="UTF-8"?>
          <Scheme LastUpgradeVersion="1500" version="1.3">
            <BuildAction parallelizeBuildables="YES" buildImplicitDependencies="YES">
              <BuildActionEntries>
                <BuildActionEntry buildForTesting="YES" buildForRunning="YES" buildForProfiling="YES" buildForArchiving="YES" buildForAnalyzing="YES">
                  <BuildableReference BuildableIdentifier="primary" BlueprintIdentifier="$RUNNER_UUID" BuildableName="Runner.app" BlueprintName="Runner" ReferencedContainer="container:Runner.xcodeproj"/>
                </BuildActionEntry>
              </BuildActionEntries>
            </BuildAction>
            <TestAction buildConfiguration="Debug" selectedDebuggerIdentifier="Xcode.DebuggerFoundation.Debugger.LLDB" selectedLauncherIdentifier="Xcode.DebuggerFoundation.Launcher.LLDB" shouldUseLaunchSchemeArgsEnv="YES" codeCoverageEnabled="NO">
              <Testables>
                <TestableReference skipped="NO">
                  <BuildableReference BuildableIdentifier="primary" BlueprintIdentifier="$TESTS_UUID" BuildableName="RunnerTests.xctest" BlueprintName="RunnerTests" ReferencedContainer="container:Runner.xcodeproj"/>
                </TestableReference>
              </Testables>
              <MacroExpansion>
                <BuildableReference BuildableIdentifier="primary" BlueprintIdentifier="$RUNNER_UUID" BuildableName="Runner.app" BlueprintName="Runner" ReferencedContainer="container:Runner.xcodeproj"/>
              </MacroExpansion>
            </TestAction>
            <LaunchAction buildConfiguration="Debug" selectedDebuggerIdentifier="Xcode.DebuggerFoundation.Debugger.LLDB" selectedLauncherIdentifier="Xcode.DebuggerFoundation.Launcher.LLDB" launchStyle="0" useCustomWorkingDirectory="NO" ignoresPersistentStateOnLaunch="NO" debugDocumentVersioning="YES" debugServiceExtension="internal" allowLocationSimulation="YES">
              <BuildableProductRunnable runnableDebuggingMode="0">
                <BuildableReference BuildableIdentifier="primary" BlueprintIdentifier="$RUNNER_UUID" BuildableName="Runner.app" BlueprintName="Runner" ReferencedContainer="container:Runner.xcodeproj"/>
              </BuildableProductRunnable>
              <AdditionalOptions/>
            </LaunchAction>
            <ProfileAction buildConfiguration="Profile" shouldUseLaunchSchemeArgsEnv="YES" savedToolIdentifier="" useCustomWorkingDirectory="NO" debugDocumentVersioning="YES">
              <BuildableProductRunnable runnableDebuggingMode="0">
                <BuildableReference BuildableIdentifier="primary" BlueprintIdentifier="$RUNNER_UUID" BuildableName="Runner.app" BlueprintName="Runner" ReferencedContainer="container:Runner.xcodeproj"/>
              </BuildableProductRunnable>
            </ProfileAction>
            <AnalyzeAction buildConfiguration="Debug"/>
            <ArchiveAction buildConfiguration="Release" revealArchiveInOrganizer="YES"/>
          </Scheme>
          XCSHEME_EOF

          echo "=== Shared scheme created ==="
          cat "$SCHEME_DIR/Runner.xcscheme"

      - name: Install dependencies
        run: flutter pub get

      - name: Apply custom iOS config
        run: |
          cp ios/custom/Info.plist ios/Runner/Info.plist
          cp ios/custom/AppDelegate.swift ios/Runner/AppDelegate.swift
          cp ios/custom/Podfile ios/Podfile
          cp ios/custom/Runner-Bridging-Header.h ios/Runner/Runner-Bridging-Header.h
          cp ios/custom/DebugProfile.entitlements ios/Runner/DebugProfile.entitlements
          cp ios/custom/Release.entitlements ios/Runner/Release.entitlements

      - name: Install pods
        working-directory: ios
        run: |
          pod repo update
          pod install

      - name: Build iOS
        run: flutter build ios --release --no-codesign

      - name: Create IPA
        working-directory: build/ios/iphoneos
        run: |
          mkdir Payload
          mv Runner.app Payload/
          zip -qq -r -9 Beta.ipa Payload

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: Beta-iOS
          path: build/ios/iphoneos/Beta.ipa
          retention-days: 30
