name: beta_messenger
description: Beta Messenger - iOS Client
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.2.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  webview_flutter: ^4.7.0
  webview_flutter_wkwebview: ^3.14.1
  shared_preferences: ^2.2.3
  flutter_secure_storage: ^9.0.0
  dio: ^5.4.1
  connectivity_plus: ^5.0.2
  path_provider: ^2.1.2
  image_picker: ^1.0.7
  permission_handler: ^11.1.0
  flutter_local_notifications: ^17.0.0
  firebase_core: ^2.25.4
  firebase_messaging: ^14.7.15
  url_launcher: ^6.2.3
  share_plus: ^7.2.1
  package_info_plus: ^5.0.1
  device_info_plus: ^9.1.2
  flutter_native_splash: ^2.3.8
  lottie: ^3.1.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.1

flutter:
  uses-material-design: true
  assets:
    - assets/
    - assets/images/
